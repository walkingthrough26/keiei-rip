name: Daily Article Generator

on:
  schedule:
    # 09:00 JST = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate but do not commit)'
        required: false
        default: 'false'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Generate daily article
        working-directory: site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/daily-article.mjs

      - name: Commit and push article
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "Keiei.RIP Bot"
          git config user.email "bot@keiei.rip"
          git add site/content/articles/ site/content/covered-companies.json
          git diff --staged --quiet || git commit -m "feat: add daily article $(date +%Y-%m-%d)"
          git push

      - name: Post to X (Twitter)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          NEW_FILE=$(git diff HEAD~1 HEAD --name-only --diff-filter=A | grep "site/content/articles/" | head -1)
          if [ -z "$NEW_FILE" ]; then
            echo "No new article committed, skipping tweet"
            exit 0
          fi
          SLUG=$(basename "$NEW_FILE" .md)
          echo "Tweeting article: $SLUG"
          cd site && node scripts/tweet-article.mjs "$SLUG"
