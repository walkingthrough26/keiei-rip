<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 30px 36px; background: var(--paper); display: flex; flex-direction: column; gap: 22px; }
  .label-row { display: flex; gap: 28px; align-items: baseline; flex-wrap: wrap; }
  .sans { font-family: var(--font-sans); color: var(--text-primary); }
  .mono { font-family: var(--font-mono); color: var(--text-primary); }
  .cap { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
  .kick { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--shu-500); }
</style>
</head>
<body>
  <div>
    <div class="cap" style="margin-bottom:8px;">UI ラベル — Zen Kaku Gothic New</div>
    <div class="label-row">
      <span class="sans" style="font-size:15px; font-weight:700;">業種で絞り込む</span>
      <span class="sans" style="font-size:14px; font-weight:500;">アーカイブを見る</span>
      <span class="sans" style="font-size:13px; font-weight:400; color:var(--text-secondary);">最終更新</span>
    </div>
  </div>
  <div>
    <div class="cap" style="margin-bottom:8px;">Metadata — JetBrains Mono</div>
    <div class="label-row">
      <span class="mono" style="font-size:22px; font-weight:500;">1998 — 2014</span>
      <span class="mono" style="font-size:13px;">NO. 0427</span>
      <span class="kick">RIP / ARCHIVE</span>
    </div>
  </div>
</body>
</html>
