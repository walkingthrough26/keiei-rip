<!-- @dsCard group="Spacing" viewport="700x250" name="罫線 & 余白の運用" subtitle="hairline rule · 朱の差し色 · ドット・リーダー" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 28px 36px; background: var(--paper); }
  .kick { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--shu-500); margin-bottom: 8px; }
  .title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--text-primary); padding-bottom: 14px; border-bottom: 1.5px solid var(--sumi); margin-bottom: 18px; }
  .leader { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-serif); font-size: 15px; color: var(--text-secondary); margin-bottom: 10px; }
  .leader .dots { flex: 1; border-bottom: 1px dotted var(--ink-300); transform: translateY(-3px); }
  .leader .pg { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="kick">SECTION 01 — Archive</div>
  <div class="title">墓碑をめぐる構造</div>
  <div class="leader"><span>はじめに</span><span class="dots"></span><span class="pg">001</span></div>
  <div class="leader"><span>業種別の墓場</span><span class="dots"></span><span class="pg">014</span></div>
  <div class="leader"><span>弔辞という記録</span><span class="dots"></span><span class="pg">027</span></div>
</body>
</html>
