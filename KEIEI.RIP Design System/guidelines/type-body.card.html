  <p class="lead">最盛期には全国に二百店舗を構えた。だが、潮目は静かに変わっていた。</p>
  <p class="body">撤退の決断は遅すぎたのかもしれない。それでも彼らは、最後の一日まで店を開け続けた。<b>失敗は、挑んだ者にしか訪れない</b>——この記録は、敗れてなお前を向いた事業者たちへの弔いであり、讃辞である。</p>
