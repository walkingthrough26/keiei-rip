<!-- @dsCard group="Colors" viewport="700x190" name="墨インク / Sumi ramp" subtitle="warm near-black → light neutrals" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 28px 30px; background: var(--paper); }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; border: 1px solid var(--ink-200); }
  .sw { aspect-ratio: 1 / 1.1; display: flex; align-items: flex-end; padding: 8px; }
  .sw span { font-family: var(--font-mono); font-size: 9px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="swatches">
    <div class="sw" style="background:var(--sumi);"><span style="color:#e8e2d8;">900</span></div>
    <div class="sw" style="background:var(--ink-800);"><span style="color:#e8e2d8;">800</span></div>
    <div class="sw" style="background:var(--ink-700);"><span style="color:#e8e2d8;">700</span></div>
    <div class="sw" style="background:var(--ink-600);"><span style="color:#e8e2d8;">600</span></div>
    <div class="sw" style="background:var(--ink-400);"><span style="color:#161310;">400</span></div>
    <div class="sw" style="background:var(--ink-300);"><span style="color:#161310;">300</span></div>
    <div class="sw" style="background:var(--ink-200);"><span style="color:#161310;">200</span></div>
    <div class="sw" style="background:var(--ink-100);"><span style="color:#161310;">100</span></div>
  </div>
</body>
</html>
