<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 26px 36px; background: var(--paper); }
  .ramp { display: flex; flex-direction: column; gap: 12px; }
  .line { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--ink-150); padding-bottom: 10px; }
  .tok { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--text-muted); width: 110px; flex: none; text-transform: uppercase; }
  .samp { font-family: var(--font-display); color: var(--text-primary); line-height: 1.1; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="line"><span class="tok">display · 64</span><span class="samp" style="font-size:38px; font-weight:900;">挑んだ証</span></div>
    <div class="line"><span class="tok">h1 · 44</span><span class="samp" style="font-size:30px; font-weight:700;">廃業の記録</span></div>
    <div class="line"><span class="tok">h2 · 32</span><span class="samp" style="font-size:24px; font-weight:600;">敗者の美学</span></div>
    <div class="line"><span class="tok">h3 · 24</span><span class="samp" style="font-size:19px; font-weight:600;">最後の決算</span></div>
    <div class="line" style="border:none;"><span class="tok">body · 17</span><span class="samp" style="font-family:var(--font-serif); font-size:16px; font-weight:400; color:var(--text-secondary);">それでも前を向いた事業者たちへ。</span></div>
  </div>
</body>
</html>
