<!-- @dsCard group="Brand" viewport="700x230" name="モチーフ / Motifs" subtitle="墓碑の天罫 · 没年表記 · 弔いマーカー" -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 28px 34px; background: var(--paper); display: flex; gap: 30px; align-items: stretch; }
  .motif { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .cap { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); }
  /* tombstone top rule */
  .stone { background: var(--paper-raised); border-top: 3px solid var(--sumi); padding: 16px 14px; box-shadow: var(--shadow-card); }
  .stone .nm { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
  .stone .dt { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  /* dates */
  .dates { font-family: var(--font-mono); font-size: 20px; color: var(--text-primary); }
  .dates .sep { color: var(--shu-500); }
  /* marker */
  .marker { font-family: var(--font-latin); font-style: italic; font-size: 22px; color: var(--shu-500); }
  .marker small { font-family: var(--font-mono); font-style: normal; font-size: 10px; letter-spacing: .2em; color: var(--text-muted); display: block; }
</style>
</head>
<body>
  <div class="motif">
    <div class="cap">天罫 / Top rule</div>
    <div class="stone"><div class="nm">株式会社 暁印刷</div><div class="dt">創業 1976 — 廃業 2009</div></div>
  </div>
  <div class="motif">
    <div class="cap">没年 / Lifespan</div>
    <div class="dates">1976 <span class="sep">—</span> 2009</div>
    <div class="cap" style="margin-top:6px;">享年 33年</div>
  </div>
  <div class="motif">
    <div class="cap">弔いマーカー</div>
    <div class="marker">R.I.P.<small>REST IN PEACE</small></div>
  </div>
</body>
</html>
